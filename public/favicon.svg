<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#1a1a2e" rx="8"/>
  <g transform="translate(16, 16)">
    <!-- Case file folder -->
    <rect x="2" y="6" width="28" height="24" fill="none" stroke="#6495ed" stroke-width="2" rx="2"/>
    <!-- File lines indicating investigation data -->
    <line x1="8" y1="14" x2="22" y2="14" stroke="#6495ed" stroke-width="1.5"/>
    <line x1="8" y1="19" x2="22" y2="19" stroke="#6495ed" stroke-width="1.5"/>
    <line x1="8" y1="24" x2="18" y2="24" stroke="#6495ed" stroke-width="1.5"/>
    <!-- Badge/seal on folder -->
    <circle cx="24" cy="8" r="4" fill="#6495ed" opacity="0.8"/>
    <text x="24" y="9" text-anchor="middle" font-size="6" fill="#1a1a2e" font-weight="bold">✓</text>
  </g>
